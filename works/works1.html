<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  
<h1>春雷</h1>

<img src="../images/syunrai_syoei.jpg" alt="小説「春雷」書影" width="300">

<p>画商の新倉盈（にいくら・みつる）は大学時代の友にして『絵を描かない画家』楡島真悟（にれしま・しんご）に招かれ、彼のアトリエを訪れる。</p>
<p>10年ぶりの再会にもかかわらず、大学時代と変わらぬ彼の姿を不思議に思いつつも、彼の作品を鑑賞する盈は、やがて”芸術についての一大決戦”が</p>
<p>行われようとしていること、そして自分の招かれた訳が、楡島の絵を鑑賞するためなのだと知る。</p>
<p>果たしてその勝敗は、『絵を描かない画家』楡島が描いた絵とは……？</p>
<p>美の燃え尽きるその時の、雷鳴のような一瞬を書き留めた、口奈蝉の名刺的作品。</p>

<link rel="stylesheet" href="../style.css">
</head>
<body>
<button type="button" class="read-btn" onclick="openBookModal()">試し読みはこちら</button>

<div id="book-modal" class="book-modal" onclick="closeBookModal()">
  <div class="book-modal-content" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="closeBookModal()">×</button>

    <div class="viewer-container">
      <button class="nav-btn prev-btn" onclick="changePage(1)">&#10094;</button>
      <img id="viewer-img" src="" alt="試し読み">
      <button class="nav-btn next-btn" onclick="changePage(-1)">&#10095;</button>
    </div>

    <div id="page-counter" class="page-counter"></div>
  </div>
</div>

  <script>
  const pages = [
    '../images/s_shidoku1.jpg',
    '../images/s_shidoku2.jpg',
    '../images/s_shidoku3.jpg',
    '../images/s_shidoku4.jpg'
  ];

  let currentPageIndex = 0;

  function openBookModal() {
    currentPageIndex = 0;
    updateViewer();
    document.getElementById('book-modal').style.display = 'flex';
  }

  function closeBookModal() {
    document.getElementById('book-modal').style.display = 'none';
  }

  function changePage(step) {
    currentPageIndex += step;

    if (currentPageIndex < 0) currentPageIndex = 0;
    if (currentPageIndex >= pages.length) currentPageIndex = pages.length - 1;

    updateViewer();
  }

  function updateViewer() {
    const img = document.getElementById('viewer-img');
    const counter = document.getElementById('page-counter');
    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');

    img.src = pages[currentPageIndex];
    counter.textContent = `${currentPageIndex + 1} / ${pages.length}`;

    prevBtn.style.display = (currentPageIndex === pages.length - 1) ? 'none' : 'block';
    nextBtn.style.display = (currentPageIndex === 0) ? 'none' : 'block';
  }
</script>

</body>
</html>
